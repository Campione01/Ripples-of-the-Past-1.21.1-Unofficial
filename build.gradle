plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.105'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def build_dir = "${project.buildDir}"
def snapshot_full_version = "${minecraft_version}-${mod_version}-${snapshot_version}"
def mod_full_version = release_snapshot.toBoolean() ? "${snapshot_full_version}" : "${minecraft_version}-${mod_version}"
def file_name = file_name
version = "${mod_full_version}"
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = "${file_name}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client_ROTP {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        
        client2_ROTP {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--username=Dev2'
        }

        server_ROTP {
            server()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer_ROTP {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data_ROTP {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    jarJar(implementation('team.unnamed:mocha')) {
    	version {
	    	strictly '[3.0.0, 3.1.0)'
	        prefer '3.0.1'
        }
    }
    additionalRuntimeClasspath 'team.unnamed:mocha:3.0.1'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

task srcJar (type: Jar) {
    from sourceSets.main.java
    archiveClassifier = 'sources'
}

artifacts {
    archives srcJar
}

// Example configuration to allow publishing using the maven-publish plugin
tasks.withType(PublishToMavenRepository) {
    doFirst {
        def file = new File("${build_dir}/tmp/variables.txt")
        file.write(
        	"SNAPSHOT_VERSION=${snapshot_full_version}\n" + 
        	"RELEASE_VERSION=${mod_full_version}\n" + 
	       	"ARCHIVES_NAME=${file_name}"
        )
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version "${snapshot_full_version}"
            from components.java
            artifact srcJar
            pom.withXml {
                def node = asNode()
                if (node.dependencies.size() > 0)
                    node.remove(node.dependencies) // Remove dependencies from .pom
            }
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('clientSettingsSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs focused client settings load smoke tests.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.github.standobyte.jojo.config.client.ClientModSettingsSmokeTest'
}

tasks.register('addonApiSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs the public addon API and namespaced ability resource smoke test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.github.standobyte.jojo.api.RotpAddonApiSmokeTest'
}

tasks.register('entityMaskPostEffectSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs focused private entity-mask capture smoke tests.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass =
            'com.github.standobyte.jojo.api.client.render.EntityMaskPostEffectSmokeTest'
}

tasks.register('clientRegionalTimeDilationSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs focused regional client time-dilation smoke tests.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass =
            'com.github.standobyte.jojo.api.client.time.ClientRegionalTimeDilationPoliciesSmokeTest'
}

tasks.register('timeStopBehaviorPolicySmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs the owner-keyed time-stop behavior policy smoke test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass =
            'com.github.standobyte.jojo.api.timestop.TimeStopBehaviorPoliciesSmokeTest'
}

tasks.register('entitySoftLandingProvidersSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs the owner-keyed all-entity soft-landing provider smoke test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass =
            'com.github.standobyte.jojo.api.block.EntitySoftLandingProvidersSmokeTest'
}

tasks.register('directionalGravityV2SmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs the focused directional-gravity v2 smoke test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass =
            'com.github.standobyte.jojo.api.gravity.DirectionalGravityV2SmokeTest'
}

tasks.register('networkPayloadSafetySmokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs core network payload bounds and ownership contract tests.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.github.standobyte.jojo.network.NetworkPayloadSafetySmokeTest'
}

tasks.named('check').configure {
    dependsOn tasks.named('clientSettingsSmokeTest')
    dependsOn tasks.named('addonApiSmokeTest')
    dependsOn tasks.named('timeStopBehaviorPolicySmokeTest')
    dependsOn tasks.named('entitySoftLandingProvidersSmokeTest')
    dependsOn tasks.named('networkPayloadSafetySmokeTest')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
