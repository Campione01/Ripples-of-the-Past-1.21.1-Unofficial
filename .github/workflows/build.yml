name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the core
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Build the add-ons and the bundle
        run: ./gradlew -p addons build --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: rotp-core
          path: build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: rotp-addons-bundle
          path: addons/bundle/build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: rotp-addons-individual
          path: |
            addons/*/build/libs/*.jar
            !addons/bundle/build/libs/*.jar
