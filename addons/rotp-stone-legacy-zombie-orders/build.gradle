// Public build of Stone Legacy: Zombie Orders (stone_legacy_zombie_orders). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/addon-module.gradle')

dependencies {
    compileOnly project(':rotp-stone-legacy')
}
