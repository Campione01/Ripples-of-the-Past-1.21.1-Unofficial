// Public build of RotP - Diego's The World (rotp_theworld). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

ext.gameTestStructures = [
        'data/rotp_theworld_bleeding/structure/empty.nbt': 'core',
]

apply from: rootProject.file('gradle/addon-module.gradle')
