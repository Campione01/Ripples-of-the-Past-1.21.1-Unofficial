modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GNU GPL v3.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Solkree, August_dr feat. Pr1tcha, StandoByte"
credits="StandoByte and the original Ripples of the Past contributors"
description='''${mod_description}

This migration derives from RotP-The-World-Alternative-Universe-1.2.1.jar.
See the packaged
SOURCE_AND_LICENSE.md and diegos-the-world-source-manifest.json for exact
provenance, repaired defects, and source-blocked audio.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
