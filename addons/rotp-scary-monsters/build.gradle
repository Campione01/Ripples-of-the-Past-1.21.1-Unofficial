// Public build of RotP Scary Monsters (scary_monsters). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

ext.gameTestStructures = [
        'data/scary_monsters/structure/empty.nbt': 'core',
        'data/scary_monsters_bleeding/structure/empty.nbt': 'core',
        'data/scary_monsters_owner_death/structure/empty.nbt': 'core',
]

apply from: rootProject.file('gradle/addon-module.gradle')
