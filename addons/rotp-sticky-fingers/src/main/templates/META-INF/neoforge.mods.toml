modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mods]]
modId="${mod_id}"
enumExtensions="META-INF/enumextensions.json"
version="${mod_version}"
displayName="${mod_name}"
authors="HK47bot, StandoByte, DikiyTechies, TheDoGGyS, Weever"
credits="Bounded 1.21.1 combat split and port of RotP Sticky Fingers"
description='''${mod_description}'''

[[mixins]]
config="rotp_stfn.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
