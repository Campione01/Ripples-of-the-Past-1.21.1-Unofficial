modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GNU GPL v3.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Babelmoth, TheDoGGy"
credits="Babelmoth, TheDoGGy, StandoByte"
description='''${mod_description}

This replacement module merges the Silver Chariot Requiem slices from
RotP-Next-Album-0.1.11.jar and RotP-银色战车镇魂曲-1.2.1.jar. The packaged
SOURCE_AND_LICENSE.md and silver-chariot-requiem-source-manifest.json
record the authority split and provenance.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
