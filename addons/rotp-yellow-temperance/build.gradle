// Public build of RotP Yellow Temperance (rotp_yellowtemperance). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/addon-module.gradle')

dependencies {
    compileOnly('maven.modrinth:pehkui:3.8.3+1.21-neoforge') {
        transitive = false
    }
    runtimeOnly('maven.modrinth:pehkui:3.8.3+1.21-neoforge') {
        transitive = false
    }
}
