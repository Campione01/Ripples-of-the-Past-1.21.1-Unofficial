modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Babelmoth"
credits="StandoByte and the original Next Album contributors"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rotp_nextalbum"
type="incompatible"
versionRange="[0.1.11]"
reason="The legacy mixed Next Album 0.1.11 mod owns the same rotp_nextalbum registry ids."
ordering="NONE"
side="BOTH"
