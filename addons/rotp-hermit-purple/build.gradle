// Public build of RotP Hermit Purple (rotp_zhp). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

ext.gameTestStructures = [
        'data/rotp_hp_lash/structure/empty.nbt': 'core',
]

apply from: rootProject.file('gradle/addon-module.gradle')

dependencies {
    compileOnly project(':rotp-emperor')
}
