modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mixins]]
config="rotp_hd.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="YarickTT, TheDoGGyS, HK47bot; 1.21.1 migration by Campione01"
credits="StandoByte and the original Ripples of the Past contributors"
description='''${mod_description}

This migration reuses canonical GPL-v3 assets from RotP-天堂之门-1.2.jar.
The source hash and migration boundary are packaged in SOURCE_AND_LICENSE.md.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
