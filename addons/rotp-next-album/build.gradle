// Public build of RotP:NextAlbum (rotp_nextalbum). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/addon-module.gradle')

dependencies {
    compileOnly('top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api') {
        transitive = false
    }
    runtimeOnly('top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1') {
        transitive = false
    }
    compileOnly('software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2') {
        transitive = false
    }
    runtimeOnly('software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2') {
        transitive = false
    }
}
