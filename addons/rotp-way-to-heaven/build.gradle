// Public build of RotP Way to Heaven (rotp_waytoheaven). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/addon-module.gradle')

dependencies {
    compileOnly project(':rotp-c-moon')
    compileOnly project(':rotp-made-in-heaven')
    compileOnly project(':rotp-whitesnake')
}
