// Public build of RotP Speed King (speedking). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

ext.gameTestStructures = [
        'data/speedking/structure/empty.nbt': 'core',
]

apply from: rootProject.file('gradle/addon-module.gradle')
