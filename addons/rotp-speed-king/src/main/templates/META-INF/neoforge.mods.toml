side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
