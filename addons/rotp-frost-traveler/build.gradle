// Public build of RotP Frost Traveler (rotp_zcs). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

ext.gameTestStructures = [
        'data/frost_injection/structure/empty.nbt': 'core',
        'data/rotp_zcs/structure/empty.nbt': 'core',
]

apply from: rootProject.file('gradle/addon-module.gradle')
