# Minecraft and core versions) come from the core's gradle.properties.
mod_id=tjojo
mod_name=Tinkers of the Past
mod_version=1.16-1.0-port.2
mod_description=NeoForge 1.21.1 migration of Tinkers of the Past. The independent materials, molten fluids, and repaired data-driven TConstruct integration are active, with restored recipe unlock advancements, block-item tooltips, and Spanish and Simplified Chinese locales on current registered keys. Donor modifier IDs and callback semantics are preserved behind one module-local bridge. No compatible 1.21.1 Mantle/TConstruct API artifacts exist to register or dispatch the single-use modifiers; the optional runtime remains link-free. Legacy bytes are packaged under inert owner-scoped archive paths.
