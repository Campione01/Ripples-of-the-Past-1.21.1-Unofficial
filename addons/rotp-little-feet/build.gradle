// Public build of RotP Little Feet (rotp_littlefeet). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

ext.gameTestStructures = [
        'data/rotp_littlefeet/structure/empty.nbt': 'H4sIAAAAAAAA/z3LsQ6CQBCE4SGHymGM72NtTWm/kjHZAHfkdiueHlFxkr+afC0QUZsuDAC2qr2IhsnVlYZtEcfnmPvB2u8b5mw7+i/gYC7OnzjNMtKdH9Kg7mQiLpMm9kVefhMtb3K+i8uDxTQn4GpYAU1Nb0GWAAAA',
]

apply from: rootProject.file('gradle/addon-module.gradle')

dependencies {
    compileOnly('maven.modrinth:pehkui:3.8.3+1.21-neoforge') {
        transitive = false
    }
    runtimeOnly('maven.modrinth:pehkui:3.8.3+1.21-neoforge') {
        transitive = false
    }
}
