modLoader="javafml"
loaderVersion="${loader_version_range}"
license="LGPL-3.0-only"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="LL, Lang Lang"
credits="Legacy resource support: Denis; Phase 1 port against the public Ripples of the Past addon contract"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[9.5.1+1.21.1]"
ordering="AFTER"
side="BOTH"
