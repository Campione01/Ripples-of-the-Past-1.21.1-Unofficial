modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="StandoByte, silentevermore, TheDoGGyS"
credits="Bounded 1.21.1 port of the original RotP Whitesnake addon by ArchLunatic and contributors; SFX credit: LAMBIRNO"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
