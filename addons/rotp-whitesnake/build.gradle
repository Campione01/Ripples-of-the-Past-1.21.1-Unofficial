// Public build of RotP Whitesnake (rotp_whitesnake). The module identity is in gradle.properties;
// the shared logic is in ../gradle/addon-module.gradle.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

apply from: rootProject.file('gradle/addon-module.gradle')

tasks.named('jar', Jar) {
    manifest {
        attributes('MixinConfigs': 'rotp_whitesnake.mixin.json')
    }
}
