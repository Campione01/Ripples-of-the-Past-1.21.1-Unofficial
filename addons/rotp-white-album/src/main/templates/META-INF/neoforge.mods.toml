modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Makuta Zeml"
credits="Lambirno (sounds), StandoByte, and the Ripples of the Past contributors"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="epicfight"
type="optional"
versionRange="[21.17.3,22)"
ordering="AFTER"
side="CLIENT"
