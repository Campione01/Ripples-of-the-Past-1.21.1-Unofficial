plugins {
    id 'java'
    id 'net.neoforged.moddev'
}

// A NeoForge Jar-in-Jar container: a code-free (lowcodefml) mod whose jar nests
// every add-on jar. Each nested jar is loaded as its own mod.
def core = rootProject.ext.core

group = rootProject.property('addon_group')
version = rootProject.property('bundle_version')
base.archivesName = 'rotp-addon-bundle-open'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = core.neo_version
}

dependencies {
    jarJar(project(':rotp-achtung-baby'))
