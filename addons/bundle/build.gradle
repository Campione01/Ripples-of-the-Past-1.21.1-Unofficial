def metadataProperties = [
        bundle_mod_id          : 'rotp_addon_bundle_open',
        bundle_version         : project.version.toString(),
        loader_version_range   : core.loader_version_range,
        minecraft_version_range: core.minecraft_version_range,
        neo_version            : core.neo_version,
        core_mod_id            : core.mod_id,
        core_mod_version       : core.mod_version
]

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(metadataProperties)
    expand(metadataProperties)
    filteringCharset = 'UTF-8'
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
}
sourceSets.main.resources.srcDir(generateModMetadata)

tasks.named('jar', Jar) {
    // ModDevGradle adds the nested jars as ordinary entries of this jar, so this
    // applies to every entry: the nested jars are stored as they are (already
    // compressed), as in the local bundle.
    entryCompression = ZipEntryCompression.STORED
    from(rootProject.file('../LICENSE')) {
        into('META-INF')
    }
    from(rootProject.file('NOTICE.md')) {
        into('META-INF')
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
