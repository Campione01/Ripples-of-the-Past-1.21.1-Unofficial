modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GNU GPL v3.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="DanielGamer321, StandoByte"
credits="Original sound and translation contributors are listed in the canonical RotP Extra Stands metadata."
description='''${mod_description}

This module derives only the Aqua Necklace logical unit from
RotP-Extra-Stands-1.1.0c.jar. See the packaged SOURCE_AND_LICENSE.md and
aqua-necklace-source-manifest.json for exact provenance and split ownership.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
