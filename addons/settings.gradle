pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'rotp-addons'

// The core is the repository root; it replaces its published coordinates here.
includeBuild('..') {
    dependencySubstitution {
        substitute(module('io.github.campione01.jojo:RipplesOfThePast-Unofficial-NeoForge')).using(project(':'))
    }
}

